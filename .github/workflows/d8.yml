# v8 11.4.183.23 d8 builder
name: build-d8-114
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
      - name: fetch v8
        run: |
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          fetch --no-history v8
          cd v8
          git fetch --depth 1 origin refs/tags/11.4.183.23
          git checkout FETCH_HEAD
          cd ..
          gclient sync -D --no-history
      - name: patch walk trace
        run: python3 patch-walk.py
      - name: gn gen
        run: |
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd v8
          tools/dev/v8gen.py x64.release -- v8_enable_object_print=true is_component_build=false symbol_level=1
      - name: ninja d8
        run: |
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd v8
          ninja -C out.gn/x64.release d8
      - name: run exploit trace
        run: |
          cd v8
          echo '=== plain run (all output) ==='
          stdbuf -o0 -e0 ./out.gn/x64.release/d8 --random-seed=1 --allow-natives-syntax /home/runner/work/v8-d8-114/v8-d8-114/dbg/expC-plain.js > /tmp/plain.txt 2>&1 || true
          cat /tmp/plain.txt | head -30
          echo '=== gdb run ==='
          sudo apt-get -qq update && sudo apt-get -qq install -y gdb
          gdb --batch -ex 'handle SIGSEGV stop nopass' \
              -ex 'run --random-seed=1 --allow-natives-syntax /home/runner/work/v8-d8-114/v8-d8-114/dbg/expC-plain.js' \
              -ex 'bt 8' \
              -ex 'x/10i $pc-20' \
              -ex 'p/x $rcx' -ex 'p/x $rax' -ex 'p/x $r14' -ex 'p/x $rsi' \
              -ex 'x/8wx 0x3fa900183bf0' \
              -ex 'x/4wx $rsi-8' \
              --args ./out.gn/x64.release/d8 > /tmp/gdbfull.txt 2>&1 || true
          echo '=== GDB FULL ==='
          cat /tmp/gdbfull.txt | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: d8-114-op
          path: |
            v8/out.gn/x64.release/d8
            v8/out.gn/x64.release/snapshot_blob.bin
          retention-days: 30
